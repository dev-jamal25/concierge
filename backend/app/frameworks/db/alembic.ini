# Alembic config (T013). Run from the backend/ directory:
#   alembic -c app/frameworks/db/alembic.ini upgrade head
[alembic]
script_location = app/frameworks/db/alembic
prepend_sys_path = .
# sqlalchemy.url is supplied at runtime by env.py from app.frameworks.config

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
