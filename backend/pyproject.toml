[project]
name = "concierge-backend"
version = "0.1.0"
description = "Concierge multi-tenant AI SaaS — backend (Owner A: Platform/Tenancy/Isolation)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastapi-users[sqlalchemy]>=13.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "hvac>=2.1",
    "pyjwt[crypto]>=2.8",
    "pgvector>=0.3",
    "httpx>=0.27",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.0",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "entities must not import outer layers"
type = "forbidden"
source_modules = ["app.entities"]
forbidden_modules = [
    "app.use_cases",
    "app.adapters",
    "app.frameworks",
]

[[tool.importlinter.contracts]]
name = "use cases must not import adapters or frameworks"
type = "forbidden"
source_modules = ["app.use_cases"]
forbidden_modules = [
    "app.adapters",
    "app.frameworks",
]
