services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-concierge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concierge}
      POSTGRES_DB: ${POSTGRES_DB:-concierge}
      CONCIERGE_APP_PASSWORD: ${CONCIERGE_APP_PASSWORD:-concierge_app}
      CONCIERGE_MANAGER_PASSWORD: ${CONCIERGE_MANAGER_PASSWORD:-concierge_manager}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  vault:
    image: hashicorp/vault:1.16
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://127.0.0.1:8200}
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ./backend
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://concierge:${POSTGRES_PASSWORD:-concierge}@postgres:5432/${POSTGRES_DB:-concierge}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "-c", "app/frameworks/db/alembic.ini", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://concierge_app:${CONCIERGE_APP_PASSWORD:-concierge_app}@postgres:5432/${POSTGRES_DB:-concierge}
      MANAGER_DATABASE_URL: postgresql+asyncpg://concierge_manager:${CONCIERGE_MANAGER_PASSWORD:-concierge_manager}@postgres:5432/${POSTGRES_DB:-concierge}
      MIGRATION_DATABASE_URL: postgresql+asyncpg://concierge:${POSTGRES_PASSWORD:-concierge}@postgres:5432/${POSTGRES_DB:-concierge}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-prod}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      GUARDRAILS_URL: http://guardrails:8002
      CLASSIFIER_URL: http://modelserver:8001
      # SERVICE_TOKEN is a dev-only fallback; api fetches it from Vault at
      # startup (T151). Leave unset in prod so Vault is the only source.
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      # LLM + embedding keys — passed from the host .env for local dev.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5-20251001}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-voyage}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-voyage-3}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    volumes:
      # Mount built widget assets so /widget.js, /widget/, /widget/assets/* are served
      # by the API's existing static-file routes (widget.py _WIDGET_DIST_CANDIDATES).
      - ./widget/dist:/app/widget/dist:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      vault:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  modelserver:
    build:
      context: ./services/modelserver
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      # SERVICE_TOKEN is a dev-only fallback; real token is fetched from Vault at
      # startup (T151). Leave unset in prod so Vault is the only source.
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
    depends_on:
      vault:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  guardrails:
    build:
      context: ./services/guardrails
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      # SERVICE_TOKEN env is a dev-only fallback; the real token is fetched
      # from Vault at startup (T151).
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      # Read-only cross-tenant DSN for loading tenants.guardrail_config at boot
      # (T172). asyncpg needs a native postgresql:// URL (no +asyncpg). Dev uses
      # concierge_manager (the only existing role with cross-tenant SELECT).
      # PROD HARDENING (Owner A coordination): provision a dedicated SELECT-only
      # `concierge_guardrails` role + SELECT-all RLS policy on tenants, and point
      # this URL at it so the security sidecar cannot write tenant rows.
      GUARDRAILS_DATABASE_URL: postgresql://concierge_manager:${CONCIERGE_MANAGER_PASSWORD:-concierge_manager}@postgres:5432/${POSTGRES_DB:-concierge}
    depends_on:
      vault:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8002:8002"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  admin:
    build:
      context: ./admin
    environment:
      ADMIN_API_BASE_URL: http://api:8000
      ADMIN_PUBLIC_API_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    command:
      [
        "streamlit",
        "run",
        "app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true",
      ]
    ports:
      - "8501:8501"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # The widget is served directly by the API at /widget.js, /widget/, and
  # /widget/assets/* via widget.py static-file routes (T053 resolved via volume
  # mount on the api service above). This stub keeps port 8003 reserved so
  # existing port mappings and smoke tests referencing :8003 don't break.
  widget-static:
    image: busybox
    command: ["sh", "-c", "echo 'widget served by api at :8000 — see /widget.js' && sleep infinity"]
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
  minio_data:
