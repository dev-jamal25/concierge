name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compose-config:
    name: Compose Config
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate compose config
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          else
            docker-compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev --locked

      - name: Ruff lint
        working-directory: backend
        run: uv run --extra dev ruff check .

      - name: Architecture gate (import-linter)
        working-directory: backend
        run: uv run --extra dev lint-imports

  unit-contract:
    name: Unit + Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev --locked

      - name: Run unit and contract tests
        working-directory: backend
        env:
          SERVICE_TOKEN: test-service-token-ci
        run: uv run --extra dev pytest tests/unit tests/contract -v --tb=short

  compose-smoke:
    name: Compose Smoke
    runs-on: ubuntu-latest

    env:
      # Project name fixes image tags to <project>-<service> so we can inspect by name.
      COMPOSE_PROJECT_NAME: concierge

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Copy env example
        run: cp .env.example .env

      - name: Build service images
        run: docker compose build migrate api modelserver guardrails

      - name: Assert modelserver image ≤ 500 MB (T147)
        run: |
          SIZE=$(docker image inspect concierge-modelserver --format='{{.Size}}')
          echo "modelserver image size: ${SIZE} bytes (limit 524288000)"
          [ "${SIZE}" -le 524288000 ] || { echo "FAIL: modelserver image exceeds 500 MB"; exit 1; }

      - name: Start full compose stack
        run: docker compose up -d --wait

      - name: Verify API healthz
        run: curl -sf http://localhost:8000/healthz | grep '"status":"ok"'

      - name: Verify modelserver healthz includes artifact_sha256 (T148)
        run: curl -sf http://localhost:8001/healthz | grep '"artifact_sha256"'

      - name: Verify guardrails healthz
        run: curl -sf http://localhost:8002/healthz | grep '"status":"ok"'

      - name: Run public widget chat smoke test
        run: make smoke

      - name: Tear down
        if: always()
        run: docker compose down -v

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: concierge
          POSTGRES_PASSWORD: concierge
          POSTGRES_DB: concierge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U concierge -d concierge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://concierge:concierge@localhost:5432/concierge
      DATABASE_URL: postgresql+asyncpg://concierge_app:concierge_app@localhost:5432/concierge
      MANAGER_DATABASE_URL: postgresql+asyncpg://concierge_manager:concierge_manager@localhost:5432/concierge
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: concierge
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      SERVICE_TOKEN: test-service-token-ci
      SESSION_SECRET: test-session-secret-ci
      PUBLIC_BASE_URL: http://localhost:8000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev --locked

      - name: Run Alembic migrations
        working-directory: backend
        run: uv run alembic -c app/frameworks/db/alembic.ini upgrade head

      - name: Run integration tests
        working-directory: backend
        run: uv run --extra dev pytest tests/integration -v --tb=short
