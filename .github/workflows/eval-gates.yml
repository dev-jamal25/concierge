name: Eval Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  classifier-eval:
    name: Classifier Eval (macro-F1 gate)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev --extra notebooks --locked

      - name: Run classifier eval (macro-F1 gate)
        working-directory: backend
        run: uv run --extra dev --extra notebooks pytest ../tests/evals/classifier/ -v -s

  redteam-eval:
    name: Red-team / PII Canary Eval
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev --locked

      - name: Run red-team / PII canary eval
        working-directory: backend
        run: uv run --extra dev pytest ../tests/evals/redteam/ -v -s

  agent-eval:
    name: Agent Tool-Selection Eval
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev --locked

      - name: Run agent tool-selection eval
        working-directory: backend
        run: uv run --extra dev pytest tests/evals/agent_tool_selection/ -v -s -m eval

  rag-eval:
    name: RAG Quality Eval
    runs-on: ubuntu-latest
    # Skips automatically when EMBEDDING_API_KEY is absent (no paid-API cost in CI).
    # To run against a real stack, add EMBEDDING_API_KEY as a repository secret and
    # provision Postgres with the Alembic schema.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev --locked

      - name: Run RAG quality eval (auto-skips without EMBEDDING_API_KEY)
        working-directory: backend
        run: uv run --extra dev pytest tests/evals/rag/test_rag_quality.py -v -s -m eval
