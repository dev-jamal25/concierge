services:
  api:
    command:
      - uvicorn
      - app.frameworks.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    volumes:
      - ./backend:/app
    environment:
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"

  vault:
    command:
      - server
      - -dev
      - -dev-listen-address=0.0.0.0:8200
      - -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
    ports:
      - "8200:8200"

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
